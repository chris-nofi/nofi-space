[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"   # Fuji C-Chain and NØFI L1 (cancunTime/etnaTimestamp in eth_getChainConfig) both support Cancun
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
fuji = "https://api.avax-test.network/ext/bc/C/rpc"
local = "http://127.0.0.1:8545"
nofi = "https://rpc-testnet.nofichain.com/avalanche-l1/evm/880024"   # NØFI L1 testnet, chain id 880024 (Subnet-EVM v1.15.0, Cancun active). Explorer: https://nofiscan.io

[etherscan]
# Snowtrace testnet verification goes through Routescan (no real API key needed; the literal "verifyContract" works)
fuji = { key = "verifyContract", chain = 43113, url = "https://api.routescan.io/v2/network/testnet/evm/43113/etherscan" }
# NØFI L1 → nofiscan.io (Blockscout v9.0.2). Blockscout ignores the key; Foundry needs a non-empty value.
# Or pass explicitly: --verifier blockscout --verifier-url https://nofiscan.io/api/
nofi = { key = "blockscout", chain = 880024, url = "https://nofiscan.io/api/" }
